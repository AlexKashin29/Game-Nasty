try{state={...fallback,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{state={...fallback}};
let soundOn=false,audioCtx=null,stageProgress={},currentWorld=null,toastTimer;
const $=(q)=>document.querySelector(q),main=$('#main');
function persist(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch{}}
function play(tone=650){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=tone;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.09,audioCtx.currentTime+.017);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.24);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.26)}catch{}}
function toast(msg){document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.append(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),2700)}
function escaped(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function updateNav(){ $('#topProgress').textContent=`✦ ${state.done.length}/6 миров`;$('#sound').textContent=soundOn?'♪':'♫';$('#sound').title=soundOn?'Выключить звуки':'Включить звуки'}
function confetti(n=32){const sym=['✦','♥','✧','❀','★'];for(let i=0;i<n;i++){let s=document.createElement('span');s.className='confetti';s.textContent=sym[Math.floor(Math.random()*sym.length)];s.style.left=(Math.random()*100)+'vw';s.style.animationDelay=(Math.random()*.6)+'s';s.style.animationDuration=(3+Math.random()*3)+'s';s.style.color=['#ffc2dc','#ffdc9e','#c2baff','#fff'][i%4];s.style.fontSize=(13+Math.random()*20)+'px';document.body.append(s);setTimeout(()=>s.remove(),6600)}}
function drawStars(){const box=$('#stars');for(let i=0;i<95;i++){let d=document.createElement('i');d.className='star';d.style.left=(Math.random()*100)+'%';d.style.top=(Math.random()*100)+'%';let w=Math.random()>0.9?3:1.5;d.style.width=w+'px';d.style.height=w+'px';d.style.setProperty('--o',(.2+Math.random()*.8).toFixed(2));d.style.setProperty('--t',(1.4+Math.random()*4)+'s');d.style.animationDelay=(-Math.random()*6)+'s';box.append(d)}}
function showIntro(){currentWorld=null;updateNav();main.innerHTML=`<section class="cover"><div class="cover-copy"><div class="eyebrow">Одна девушка · целая галактика</div><h1 class="serif">Настя,<br><span class="rose">ты — моя</span><br>вселенная.</h1><p class="cover-desc">${CONFIG.intro}</p><button class="btn" id="start">${state.intro?'Вернуться в галактику':'Начать волшебное путешествие'} <span>→</span></button><div class="intro-note">6 планет · мини-игры · комплименты · секретный финал</div></div><div class="cover-art"><img alt="Сказочные герои Настя, Саша и их серый кот" src="${IMG.couple_art}"><span class="cover-spark">✧ Космическая любовь одобрена котом</span><span class="cover-tag">для самой чудесной Насти</span><span class="float-star" style="top:15%;right:8%">✧</span></div></section>`;$('#start').onclick=()=>{state.intro=true;persist();play();showMap()}}
function showMap(){currentWorld=null;updateNav();main.innerHTML=`<div class="map-title"><div class="eyebrow">Звёздная карта</div><h2 class="serif">Шесть миров.<br><span class="rose">Одна Настя.</span></h2><p>Исследуй планеты по порядку и собери шесть сердечек. Саша и кот уже ждут приключений.</p><div class="progress"><span style="width:${state.done.length/6*100}%"></span></div><div class="muted" style="font-size:13px">Открыто ${state.done.length} из 6 сердечек</div></div><section class="planets">${CONFIG.worlds.map((w,i)=>{const done=state.done.includes(w.id),locked=i>0&&!state.done.includes(CONFIG.worlds[i-1].id);return `<button class="planet-card ${done?'done':''} ${locked?'locked':''}" data-world="${w.id}" ${locked?'disabled aria-label="Планета пока закрыта"':''}><div class="planet-sphere" style="--planet:${w.color}">${w.icon}</div><div><div class="planet-label">${w.name}</div><div class="planet-sub">${w.desc}</div><div class="planet-status">${done?'✓ Сердечко получено':locked?'🔒 Сначала предыдущий мир':'✦ Исследовать →'}</div></div></button>`}).join('')}</section><aside class="map-helper"><img class="helper-pic" src="${IMG.alex_art}" alt="Саша — помощник"><div><strong>✦ Сообщение от Саши</strong><p>${CONFIG.helper}</p></div></aside>${state.done.length===6?'<div style="text-align:center;margin:10px"><button class="btn" id="toFinal">Открыть секретный финал ♡ →</button></div>':''}<div class="achievements">${state.done.map(i=>`<span>♡ ${CONFIG.worlds.find(w=>w.id===i).name}</span>`).join('')}</div>`;
 main.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>showWorld(b.dataset.world));if($('#toFinal'))$('#toFinal').onclick=showFinal}
function showWorld(id){currentWorld=id;stageProgress={};const w=CONFIG.worlds.find(x=>x.id===id);if(!w)return showMap();play(500);main.innerHTML=`<div class="world-header"><button class="back" id="backmap">← Звёздная карта</button><span class="chip">${CONFIG.worlds.findIndex(x=>x.id===id)+1}/6 планета</span></div><div class="world-title"><div class="eyebrow">${w.desc}</div><h2 class="serif">${w.name}</h2><p>${w.subtitle}</p></div><div class="mission"><div class="mission-label">✦ Небольшая миссия</div><p style="margin:0 0 15px;color:#f6e8f8">${w.task}</p><div id="activity"></div><div id="reward"></div></div>`;$('#backmap').onclick=showMap;
 ({beauty:makeBeauty,character:makeCharacter,laughter:makeLaughter,care:makeCare,memories:makeMemories,future:makeFuture})[id]();}
function finish(id){if(stageProgress.finished)return;stageProgress.finished=true;const w=CONFIG.worlds.find(x=>x.id===id);let newly=!state.done.includes(id);if(newly){state.done.push(id);persist();updateNav();confetti(28)}play(920);const nextIdx=CONFIG.worlds.findIndex(x=>x.id===id)+1;$('#reward').innerHTML=`<div class="result"><div style="font-size:33px">💗</div><h3>Сердечко найдено!</h3><p>${w.reward}</p><button class="btn" id="nextWorld">${nextIdx===6?'К нашей финальной звезде':'Следующая планета'} <span>→</span></button></div>`;$('#nextWorld').onclick=()=>nextIdx===6?showFinal():showWorld(CONFIG.worlds[nextIdx].id);$('#reward').scrollIntoView({behavior:'smooth',block:'nearest'})}
function makeBeauty(){const coords=[[15,67],[32,24],[50,55],[70,17],[87,65]];stageProgress.hits=[];$('#activity').innerHTML=`<div class="constellation" id="sky"><svg id="links" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>${coords.map((p,i)=>`<button class="const-btn" data-star="${i}" style="left:${p[0]}%;top:${p[1]}%" aria-label="Звезда ${i+1}">✦</button>`).join('')}</div><div class="captured-phrase" id="phrase">Коснись звёзд ✧</div><div class="counter" id="progressCount">0/5 звёзд</div>`;let phrases=['Твои глаза — отдельная галактика.','Твоя улыбка — мой любимый свет.','Ты прекрасна даже без всякого волшебства.','В тебе столько нежности и красоты.','А самая яркая звезда — ты, Зай.'];$('#sky').querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{let i=+b.dataset.star;if(stageProgress.hits.includes(i))return;stageProgress.hits.push(i);b.classList.add('selected');play(550+i*65);$('#phrase').textContent=phrases[stageProgress.hits.length-1];$('#progressCount').textContent=stageProgress.hits.length+'/5 звёзд';$('#links').innerHTML=stageProgress.hits.slice(1).map((index,j)=>{let a=coords[stageProgress.hits[j]],c=coords[index];return `<line x1="${a[0]}" y1="${a[1]}" x2="${c[0]}" y2="${c[1]}" stroke="#ffdfc5" stroke-width=".75" opacity=".85"/>`}).join('');if(stageProgress.hits.length===5)finish('beauty')})}
function makeCharacter(){stageProgress.hits=[];$('#activity').innerHTML=`<div class="quality-grid">${CONFIG.quality.map((q,i)=>`<button class="quality" data-q="${i}"><span class="q-emoji">${q[0]}</span><span class="q-label">${q[1]}</span><span class="q-text">Открыть секрет</span></button>`).join('')}</div><div class="counter" id="qualityCount">Раскрыто 0/4 качества</div>`;$('#activity').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{let i=+b.dataset.q;if(stageProgress.hits.includes(i))return;stageProgress.hits.push(i);b.classList.add('on');b.querySelector('.q-text').textContent=CONFIG.quality[i][2];$('#qualityCount').textContent='Раскрыто '+stageProgress.hits.length+'/4 качества';play(540+i*30);if(stageProgress.hits.length===4)finish('character')})}
function makeLaughter(){stageProgress.hits=0;$('#activity').innerHTML='<div class="bubble-stage" id="bubbles"></div><div class="counter" id="bubbleCount">0/8 облачков</div><div class="laugh-msg" id="laughMessage">Проверим, сколько комплиментов поместится в облака?</div>';const stage=$('#bubbles');function spawn(){const b=document.createElement('button');b.className='bubble';b.textContent=['♡','✧','☁','✿','★'][Math.floor(Math.random()*5)];let x=5+Math.random()*76,y=6+Math.random()*65;b.style.left=x+'%';b.style.top=y+'%';b.style.animationDelay=(-Math.random()*3)+'s';b.setAttribute('aria-label','Поймать облачко');stage.append(b);b.onclick=()=>{if(stageProgress.finished)return;stageProgress.hits++;$('#bubbleCount').textContent=stageProgress.hits+'/8 облачков';$('#laughMessage').textContent=CONFIG.laughs[stageProgress.hits-1];play(620+stageProgress.hits*40);b.remove();if(stageProgress.hits===8)finish('laughter');else spawn()}}for(let i=0;i<5;i++)spawn()}
function makeCare(){stageProgress.hits=[];const pos=[[13,20],[45,35],[78,22],[27,78],[75,76]];$('#activity').innerHTML=`<div class="hearts-stage">${pos.map((p,i)=>`<button class="heart-glow" data-care="${i}" style="left:${p[0]}%;top:${p[1]}%" aria-label="Искорка ${i+1}">💛</button>`).join('')}</div><div class="care-quote" id="careText">Согрей остров прикосновениями</div><div class="counter" id="careCount">0/5 искорок</div>`;$('#activity').querySelectorAll('[data-care]').forEach(b=>b.onclick=()=>{const i=+b.dataset.care;if(stageProgress.hits.includes(i))return;stageProgress.hits.push(i);b.classList.add('on');$('#careCount').textContent=stageProgress.hits.length+'/5 искорок';$('#careText').textContent=CONFIG.cares[i];play(600+30*i);if(stageProgress.hits.length===5)finish('care')})}
function makeMemories(){stageProgress.hits=[];$('#activity').innerHTML=`<div class="memory-grid">${CONFIG.memories.map((m,i)=>`<button class="memory-card" data-photo="${i}" aria-label="Открыть фото ${i+1}"><span class="memory-num">0${i+1}</span><img src="${IMG[m[0]]}" alt="${escaped(m[1])}"><span class="hidden-q">?</span></button>`).join('')}</div><div class="memory-caption" id="memoryText">Каждая карточка хранит кого-то особенного</div><div class="counter" id="memoryCount">0/4 фотографий</div>`;$('#activity').querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{const i=+b.dataset.photo;if(stageProgress.hits.includes(i))return;stageProgress.hits.push(i);b.classList.add('open');$('#memoryText').textContent=CONFIG.memories[i][1];$('#memoryCount').textContent=stageProgress.hits.length+'/4 фотографий';play(580+80*i);if(i===3&&!state.cat){state.cat=true;persist();toast('🏆 Достижение: Верховный котоконтроль')}if(stageProgress.hits.length===4)finish('memories')})}
function makeFuture(){stageProgress.hits=[];$('#activity').innerHTML=`<div class="wish-grid">${CONFIG.wishes.map((w,i)=>`<button class="wish" data-wish="${i}"><span>${w[0]}</span><span>${w[1]}</span></button>`).join('')}</div><div class="counter" id="wishCount">0/3 желаний</div>`;$('#activity').querySelectorAll('[data-wish]').forEach(b=>b.onclick=()=>{const i=+b.dataset.wish;if(stageProgress.finished)return;if(stageProgress.hits.includes(i)){stageProgress.hits=stageProgress.hits.filter(x=>x!==i);b.classList.remove('on')}else{stageProgress.hits.push(i);b.classList.add('on');play(670)}$('#wishCount').textContent=stageProgress.hits.length+'/3 желаний';if(stageProgress.hits.length===3)finish('future')})}
function showFinal(){if(state.done.length<6)return showMap();currentWorld=null;updateNav();main.innerHTML=`<div class="world-header"><button class="back" id="backmap">← К планетам</button><span class="chip">✦ Секретный финал</span></div><div class="world-title"><div class="eyebrow">Все шесть сердечек вместе</div><h2 class="serif">Две звезды.<br><span class="rose">Одна история.</span></h2><p>Это путешествие кое-кто затеял не просто так...</p></div><section class="final-scene ${state.final?'united bonded':''}" id="finalScene"><img class="final-couple" src="${IMG.final_couple}" alt="Настя и Саша вместе в сказочной вселенной"><img class="final-person nastya" src="${IMG.nastya_art}" alt="Настя — сказочная героиня"><img class="final-person alex" src="${IMG.alex_art}" alt="Саша — сказочный герой"><div class="final-heart">💖</div><img class="final-cat" src="${IMG.cat}" alt="Их серый кот"></section><div style="text-align:center"><button class="btn" id="reveal" ${state.final?'style="display:none"':''}>Соединить наши звёзды ♡</button></div><section class="final-text ${state.final?'show':''}" id="finalText"><div class="eyebrow">Послание от Саши</div><h2 class="serif">Малыш, я тебя<br><span class="rose">очень-очень обожаю.</span></h2><p>Ты — моя красотка, моя радость, мой любимый человек и целая вселенная прекрасных мелочей. Я обожаю твои глаза, улыбку, смех, нежность, характер и то, какая ты настоящая.</p><p>И если мне предложат выбрать любую звезду во вселенной, я всё равно выберу тебя.</p><div class="final-badge">♡ Саша + Настя · бесконечность</div><div style="margin:20px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap"><button class="btn outline" id="backAgain">Ещё раз посмотреть планеты ↗</button><button class="btn outline" id="restart">Пройти с начала ↺</button></div></section>`;$('#backmap').onclick=showMap;function attachAgain(){if($('#backAgain'))$('#backAgain').onclick=showMap;if($('#restart'))$('#restart').onclick=()=>{if(window.confirm('Начать путешествие с самого начала?')){state={...fallback,done:[]};persist();showIntro()}}};attachAgain();$('#reveal').onclick=()=>{state.final=true;persist();$('#finalScene').classList.add('united');setTimeout(()=>$('#finalScene')?.classList.add('bonded'),1600);$('#finalText').classList.add('show');$('#reveal').style.display='none';attachAgain();confetti(90);play(880);setTimeout(()=>play(1100),220);$('#finalText').scrollIntoView({behavior:'smooth',block:'nearest'})};if(state.final)$('#finalText').classList.add('show')}
$('#logo').onclick=showIntro;$('#sound').onclick=()=>{soundOn=!soundOn;updateNav();play(740);toast(soundOn?'Волшебные звуки включены ♫':'Звуки выключены')};drawStars();updateNav();showIntro();
</script>
</body></html>
